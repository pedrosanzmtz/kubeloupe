apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger
  template:
    metadata:
      labels:
        app: logger
    spec:
      containers:
        - name: logger
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date -u +%FT%TZ) INFO hello from logger\"; sleep 2; done"]
---
# A pod the scheduler can never place (no node has 1000 CPUs / 100Gi),
# so it stays Pending — exercises the Pending phase in the UI.
apiVersion: v1
kind: Pod
metadata:
  name: hungry
  namespace: default
spec:
  containers:
    - name: hungry
      image: nginx:1.27
      resources:
        requests:
          cpu: "1000"
          memory: 100Gi
---
# A container that exits 1 straight away, so it lands in CrashLoopBackOff
# with a growing restart count — exercises the error states in the UI.
apiVersion: v1
kind: Pod
metadata:
  name: crashed
  namespace: demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "exit 1"]
