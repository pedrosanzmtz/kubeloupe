apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger
  template:
    metadata:
      labels:
        app: logger
    spec:
      containers:
        - name: logger
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date -u +%FT%TZ) INFO hello from logger\"; sleep 2; done"]
---
# A pod the scheduler can never place (no node has 1000 CPUs / 100Gi),
# so it stays Pending — exercises the Pending phase in the UI.
apiVersion: v1
kind: Pod
metadata:
  name: hungry
  namespace: default
spec:
  containers:
    - name: hungry
      image: nginx:1.27
      resources:
        requests:
          cpu: "1000"
          memory: 100Gi
---
# A container that exits 1 straight away, so it lands in CrashLoopBackOff
# with a growing restart count — exercises the error states in the UI.
apiVersion: v1
kind: Pod
metadata:
  name: crashed
  namespace: demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      # Prints before dying so `logs --previous` has something to show.
      command: ["sh", "-c", "echo \"starting up at $(date -u +%FT%TZ)\"; echo 'FATAL: cannot reach database' >&2; sleep 3; exit 1"]
---
# Multi-container pod with an init container and a sidecar, for the log
# container picker (init, app and sidecar each print something distinct).
apiVersion: v1
kind: Pod
metadata:
  name: multi
  namespace: demo
spec:
  initContainers:
    - name: init-setup
      image: busybox:1.36
      command: ["sh", "-c", "echo init-setup: preparing config; sleep 1; echo init-setup: done"]
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date -u +%FT%TZ) app: serving request\"; sleep 1; done"]
    - name: sidecar
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date -u +%FT%TZ) sidecar: proxy heartbeat\"; sleep 3; done"]
