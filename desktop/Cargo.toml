[package]
name = "kubeloupe-desktop"
version = "0.1.0"
edition = "2021"
description = "kubeloupe desktop app — a Lens alternative in Rust, built with Tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"

[dependencies]
futures = "0.3"
kube = { version = "2", features = ["ws"] }
kubeloupe = { path = "..", features = ["specta"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
