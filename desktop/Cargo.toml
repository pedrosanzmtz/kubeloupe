[package]
name = "kubeloupe-desktop"
version = "0.1.0"
edition = "2021"
description = "kubeloupe desktop app — a Lens alternative in Rust, built with Tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"

[dependencies]
futures = "0.3"
kube = { version = "2", features = ["ws"] }
kubeloupe = { path = ".." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
