<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>kubeloupe</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="vendor/xterm.css" />
</head>
<body>
<div id="app">
  <header>
    <div class="brand">kubeloupe</div>
    <div class="cluster">
      <span id="status-dot" class="dot unknown"></span>
      <span id="status-text">Connecting…</span>
    </div>
    <select id="context-select" aria-label="Cluster context"></select>
    <button id="refresh-btn" type="button">Refresh</button>
  </header>

  <div id="main">
    <nav id="sidebar">
      <button class="nav-btn" data-view="overview" type="button">Overview</button>
      <button class="nav-btn active" data-view="pods" type="button">Pods</button>
      <button class="nav-btn" data-view="namespaces" type="button">Namespaces</button>
      <button class="nav-btn" data-view="nodes" type="button">Nodes</button>
    </nav>

    <section id="content">
      <div id="toolbar">
        <select id="namespace-select" aria-label="Namespace">
          <option value="">All namespaces</option>
        </select>
        <input id="search-input" type="search" placeholder="Filter…" aria-label="Filter" />
        <label class="auto-refresh"><input id="auto-refresh" type="checkbox" checked /> Auto-refresh (30s)</label>
      </div>
      <div id="error" class="hidden"></div>
      <div id="overview" class="hidden"></div>
      <div id="table-wrap">
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
        <p id="empty" class="hidden">No items found.</p>
      </div>
    </section>

    <aside id="detail" class="hidden">
      <div id="detail-header">
        <span id="detail-title"></span>
        <button id="detail-close" type="button" aria-label="Close details">✕</button>
      </div>
      <div id="detail-body"></div>
      <div id="logs-header">
        <h3>Logs</h3>
        <label class="auto-refresh"><input id="log-follow" type="checkbox" checked /> Follow</label>
        <button id="log-clear" type="button">Clear</button>
      </div>
      <pre id="log-output"></pre>
      <div class="detail-section-header">
        <h3>Terminal</h3>
        <button id="term-open" type="button">Open terminal</button>
        <button id="term-close" type="button" class="hidden">Close</button>
      </div>
      <div id="terminal" class="hidden"></div>
      <div class="detail-section-header">
        <h3>Port forward</h3>
        <input id="pf-port" type="number" value="80" min="1" max="65535" aria-label="Pod port" />
        <button id="pf-start" type="button">Forward</button>
        <button id="pf-stop" type="button" class="hidden">Stop</button>
      </div>
      <p id="pf-status" class="detail-status muted"></p>
      <div class="detail-section-header">
        <h3>YAML</h3>
        <button id="yaml-reload" type="button">Reload</button>
        <button id="yaml-save" type="button">Save</button>
      </div>
      <textarea id="yaml-editor" spellcheck="false" aria-label="Pod YAML"></textarea>
      <p id="yaml-status" class="detail-status muted"></p>
    </aside>
  </div>

  <footer>
    <span id="count"></span>
    <span id="updated"></span>
  </footer>
</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<script src="app.js"></script>
</body>
</html>
