name: Release

# Pushing a tag like v0.1.0 builds the desktop installers and CLI binaries for
# Linux, macOS and Windows and releases them:
#   1. `prepare` checks the versions and creates a *draft* release.
#   2. `desktop` and `cli` build, smoke-check and upload into the draft.
#   3. `publish` checks every expected asset is there, uploads SHA256SUMS and
#      only then publishes the draft. A failed build leaves just the draft.
#
# Running it by hand (Actions > Release > Run workflow) is a dry run by
# default: it builds everything and uploads it as workflow artifacts, without
# creating a tag or a release. Use it to test release changes before tagging.
#
# Bump versions with scripts/bump-version.sh. Pre-releases must be numeric
# (v0.2.0-1, not v0.2.0-rc.1) because the MSI bundler (WiX) rejects others.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only and upload workflow artifacts (no release). Turning this off only works when run from a v* tag."
        type: boolean
        default: true
  # TEMPORARY (PR #29 testing): workflow_dispatch only works once this file is
  # on the default branch, so run the dry run on PRs that touch it. Remove
  # before merging.
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      dry_run: ${{ steps.meta.outputs.dry_run }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and mode
        id: meta
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          fail=0
          for f in desktop/Cargo.toml; do
            v=$(grep -m1 '^version' "$f" | sed -E 's/.*"(.*)".*/\1/')
            [ "$v" = "$version" ] || { echo "::error::$f version $v != Cargo.toml $version"; fail=1; }
          done
          v=$(python3 -c "import json;print(json.load(open('desktop/tauri.conf.json'))['version'])")
          [ "$v" = "$version" ] || { echo "::error::tauri.conf.json version $v != Cargo.toml $version"; fail=1; }
          for p in kubeloupe kubeloupe-desktop; do
            v=$(grep -A1 "^name = \"$p\"$" Cargo.lock | sed -nE 's/^version = "(.*)"/\1/p')
            [ "$v" = "$version" ] || { echo "::error::Cargo.lock $p version $v != Cargo.toml $version"; fail=1; }
          done
          # WiX (MSI) only takes a numeric pre-release, at most 65535.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-([0-9]+))?$ ]] || \
             [ "${BASH_REMATCH[2]:-0}" -gt 65535 ]; then
            echo "::error::version $version is not MAJOR.MINOR.PATCH[-N] (N <= 65535); the MSI bundler would reject it"
            fail=1
          fi
          [ "$fail" -eq 0 ] || { echo "Fix with scripts/bump-version.sh <version>"; exit 1; }

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            dry_run=false
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "false" ]; then
            dry_run=false
          else
            dry_run=true
          fi

          if [ "$dry_run" = "false" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "::error::A real release must run from a v* tag (got $GITHUB_REF_TYPE $GITHUB_REF_NAME)"
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
            [ "$tag" = "v$version" ] || { echo "::error::tag $tag != v$version"; exit 1; }
          else
            tag="v$version"
          fi
          echo "dry_run=$dry_run tag=$tag version=$version"
          {
            echo "dry_run=$dry_run"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Create a draft release with generated notes
        id: release
        if: steps.meta.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # Reuse the draft of an earlier failed run; never touch a published one.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | head -n1)
          if [ -n "$existing" ]; then
            read -r id draft <<<"$existing"
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to modify it"
              exit 1
            fi
            echo "Reusing draft release $id"
          else
            cat > notes.md <<'EOF'
          The builds are not signed yet, so the OS will warn you the first time:

          - **macOS**: drag the app to Applications, then right-click it and choose Open (then Open again). If macOS says the app is damaged, run `xattr -dr com.apple.quarantine /Applications/kubeloupe.app`.
          - **Windows**: SmartScreen shows "Windows protected your PC"; click More info, then Run anyway.
          - **Linux**: no workaround needed; the AppImage needs FUSE 2 (`libfuse2`) on recent Ubuntu.

          Verify a download with `sha256sum -c SHA256SUMS --ignore-missing`.
          EOF
            pre=""
            case "$TAG" in *-*) pre="--prerelease";; esac
            gh release create "$TAG" --draft --verify-tag $pre \
              --title "kubeloupe $TAG" --notes-file notes.md --generate-notes
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -n1)
          fi
          [ -n "$id" ] || { echo "::error::could not find the draft release id"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # older glibc on purpose: runs on more distros
            name: linux
            args: ""
            targets: ""
          - os: macos-latest
            name: macos-universal
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: windows-latest
            name: windows
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop

      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/ui-src/.nvmrc
          cache: npm
          cache-dependency-path: desktop/ui-src/package-lock.json

      # Build the frontend here rather than through tauri.conf.json's
      # beforeBuildCommand: Tauri runs that hook from the frontend directory
      # it detects (desktop/ui-src), where `npm --prefix ui-src` points at a
      # nonexistent desktop/ui-src/ui-src. The --config below disables it.
      - name: Build the frontend
        run: |
          npm ci
          npm run build
        working-directory: desktop/ui-src

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # build.rs writes desktop/icons/icon.png at build time, but the bundler
      # also needs .ico/.icns/sized PNGs, so extract the embedded icon and
      # expand it with `cargo tauri icon` before bundling.
      - name: Generate app icons
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, re
          src = open("desktop/build.rs").read()
          b64 = re.search(r'ICON_PNG_BASE64: &str = "([^"]+)"', src).group(1)
          open("desktop/icons/icon.png", "wb").write(base64.b64decode(b64))
          PY
          cargo tauri icon desktop/icons/icon.png --output desktop/icons

      # With a releaseId it uploads into the draft; without one (dry run) it
      # only builds.
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: cargo tauri
          releaseId: ${{ needs.prepare.outputs.release_id }}
          uploadUpdaterJson: false
          args: >-
            ${{ matrix.args }}
            --config '{"build":{"beforeBuildCommand":null},"bundle":{"icon":["icons/32x32.png","icons/128x128.png","icons/128x128@2x.png","icons/icon.icns","icons/icon.ico"]}}'

      - name: Collect the bundles
        shell: bash
        run: |
          mkdir dist
          shopt -s nullglob globstar
          for f in target/**/release/bundle/{appimage/*.AppImage,deb/*.deb,dmg/*.dmg,msi/*.msi,nsis/*.exe}; do
            cp "$f" dist/
          done
          ls -l dist
          case "$RUNNER_OS" in
            Linux)   want=("*.AppImage" "*.deb") ;;
            macOS)   want=("*_universal.dmg") ;;
            Windows) want=("*.msi" "*-setup.exe") ;;
          esac
          for p in "${want[@]}"; do
            compgen -G "dist/$p" >/dev/null || { echo "::error::no bundle matching $p"; exit 1; }
          done

      - name: Smoke-check the Linux bundles
        if: runner.os == 'Linux'
        run: |
          dpkg -I dist/*.deb
          dpkg -c dist/*.deb | grep -E '\./usr/bin/'
          appimage=$(ls dist/*.AppImage)
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          bin=$(find "$RUNNER_TEMP/squashfs-root/usr/bin" -maxdepth 1 -type f -perm -u+x | head -n1)
          [ -n "$bin" ] || { echo "::error::no executable in the AppImage's usr/bin"; exit 1; }
          file "$bin"
          file "$bin" | grep -q 'ELF 64-bit'

      - name: Smoke-check the macOS bundle
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls dist/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          app=$(ls -d "$mnt"/*.app | head -n1)
          bin="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          lipo -archs "$bin"
          archs=$(lipo -archs "$bin")
          hdiutil detach "$mnt"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "::error::not a universal binary: $archs"; exit 1; }

      - name: Smoke-check the Windows bundles
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for f in dist/*.msi dist/*.exe; do
            size=$(stat -c %s "$f")
            echo "$f: $size bytes"
            [ "$size" -gt 1000000 ] || { echo "::error::$f is suspiciously small"; exit 1; }
          done

      - name: Upload the bundles as workflow artifacts (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  cli:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cli-${{ matrix.target }}

      - name: Build the CLI
        run: cargo build --release --locked -p kubeloupe --target ${{ matrix.target }}

      # x86_64-apple-darwin runs under Rosetta on the arm64 macOS runner.
      - name: Smoke-check the CLI
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/kubeloupe"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          file "$bin" || true
          "$bin" --help

      - name: Package
        id: package
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          name="kubeloupe-cli-${TAG}-${{ matrix.target }}"
          out="target/${{ matrix.target }}/release"
          mkdir "$name"
          cp README.md "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$out/kubeloupe.exe" "$name/"
            7z a "$name.zip" "$name"
            asset="$name.zip"
          else
            cp "$out/kubeloupe" "$name/"
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload to the draft release
        if: needs.prepare.outputs.dry_run == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" "${{ steps.package.outputs.asset }}" --clobber

      - name: Upload as a workflow artifact (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, desktop, cli]
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch the release assets
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          rm -f assets/SHA256SUMS

      - name: Fetch the workflow artifacts (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Check every expected asset is there and write SHA256SUMS
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cd assets
          ls -l
          fail=0
          for p in "*.AppImage" "*.deb" "*_universal.dmg" "*.msi" "*-setup.exe" \
                   "kubeloupe-cli-$TAG-x86_64-unknown-linux-gnu.tar.gz" \
                   "kubeloupe-cli-$TAG-aarch64-apple-darwin.tar.gz" \
                   "kubeloupe-cli-$TAG-x86_64-apple-darwin.tar.gz" \
                   "kubeloupe-cli-$TAG-x86_64-pc-windows-msvc.zip"; do
            compgen -G "$p" >/dev/null || { echo "::error::missing asset $p"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS as a workflow artifact (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: assets/SHA256SUMS
          retention-days: 7

      - name: Upload SHA256SUMS and publish the release
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" assets/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
