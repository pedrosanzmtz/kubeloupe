name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2.7.8
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  desktop-build:
    name: desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2.7.8
      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/ui-src/.nvmrc
          cache: npm
          cache-dependency-path: desktop/ui-src/package-lock.json
      - name: Build the frontend
        run: |
          npm ci
          npm run build
        working-directory: desktop/ui-src
      - name: Build desktop crate
        run: cargo build -p kubeloupe-desktop --locked

  frontend:
    name: frontend (svelte-check, bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2.7.8
      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/ui-src/.nvmrc
          cache: npm
          cache-dependency-path: desktop/ui-src/package-lock.json
      - name: Regenerate the TypeScript bindings
        run: cargo test -p kubeloupe-desktop --locked export_typescript_bindings
      - name: Fail if bindings.ts is out of date
        run: |
          git diff --exit-code -- desktop/ui-src/src/lib/bindings.ts || {
            echo "::error::bindings.ts is out of date. Run 'cargo test -p kubeloupe-desktop export_typescript_bindings' and commit it."
            exit 1
          }
      - run: npm ci
        working-directory: desktop/ui-src
      - run: npm run build
        working-directory: desktop/ui-src
      - name: Fail if the test entry leaked into the production build
        run: |
          if [ -e dist/test.html ] || grep -rqE "__fake|fake-backend" dist; then
            echo "::error::dist/ contains the test-only entry (test.html / src/test)."
            exit 1
          fi
        working-directory: desktop/ui-src
      - run: npm run check
        working-directory: desktop/ui-src
      - name: Unit tests (Vitest)
        run: npm test
        working-directory: desktop/ui-src
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
        working-directory: desktop/ui-src
      - uses: actions/cache@v4.2.3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: desktop/ui-src
      - name: Install Chromium's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: desktop/ui-src
      - name: App tests (Playwright, fake backend)
        run: npx playwright test
        working-directory: desktop/ui-src
      - name: Upload Playwright screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-results
          path: |
            desktop/ui-src/test-results/
            desktop/ui-src/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
